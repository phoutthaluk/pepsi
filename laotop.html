<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="laotop.css" />
    <script
      src="https://kit.fontawesome.com/b220043b3b.js"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body>
    <!-- form_laotop -->
    <section class="container">
      <!-- h_custom -->
        <div class="h_custom">
            <!-- img_form -->
                <div class="image">
                <img src="../img/image copy 6.png" class="img_logo" alt="" />
                </div>

                <form action="" class="container_form">
                <div class="btn_contact_laotop">
                    <button type="button" class="social_btn">
                    <i class="fab fa-facebook-f"></i>
                    </button>
                    <button type="button" class="social_btn">
                    <i class="fab fa-twitter"></i>
                    </button>
                    <button type="button" class="social_btn">
                    <i class="fab fa-linkedin-in"></i>
                    </button>
                </div>

                <div class="form_text">
                    <h1><span>ລະບົບກວດຜົນສອບເສັງ</span></h1>
                </div>

                <div>
                    <label class="form_label">ລະຫັດເຂົ້າຫ້ອງເສັງ :</label>
                    <input
                    type="text"
                    class="form_input"
                    placeholder="ກະລຸນາປ້ອນລະຫັດເຂົ້າຫ້ອງສອບເສັງ"
                    />
                </div>

                <div>
                    <button type="submit" class="btn_submit">ກວດສອບຜົນເສັງ</button>
                </div>
                </form>
            </div>
        <div class="h_text">
            <div class="text_position">
            ວິທະຍາໄລ ລາວ-ທ໊ອບ, ບ້ານ ໂພນປ່າເປົ້າ ເມືອງ ສີສັດຕະນາກ ນະຄອນຫຼວງວຽງຈັນ
            </div>
        </div>
    </section>
  </body>
</html>
